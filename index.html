<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naruto — Shinobi Scroll &amp; Jutsu Task Manager</title>

  <!-- Anime / Ninja Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Russo+One&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ===== ROOT VARIABLES — Naruto Palette ===== */
    :root {
      --naruto-orange: #FF6B00;
      --naruto-orange-dark: #CC5500;
      --rasengan-cyan: #00E5FF;
      --rasengan-blue: #0088FF;
      --rasengan-glow: rgba(0, 229, 255, 0.35);
      --sage-gold: #FFC700;
      --sage-glow: rgba(255, 199, 0, 0.3);
      --scroll-parchment: #F7E7CE;
      --scroll-dark: #3A2E2B;
      --scroll-line: #C4A882;
      --konoha-green: #2E7D32;
      --akatsuki-red: #D32F2F;
      --chakra-purple: #9C27B0;
      --bg-dark: #1A1410;
      --card-bg: rgba(58, 46, 43, 0.75);
      --card-border: rgba(196, 168, 130, 0.15);
      --text-main: #F5EDE0;
      --text-dim: #A09080;
      --text-bright: #FFF8EC;
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    /* ===== GLOBAL RESET ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg-dark);
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(255, 107, 0, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(0, 137, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(255, 199, 0, 0.04) 0%, transparent 60%),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(196, 168, 130, 0.03) 40px, rgba(196, 168, 130, 0.03) 41px);
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      padding: 20px 12px;
      position: relative;
    }

    /* ===== KONOHA WATERMARK BACKGROUND ===== */
    .konoha-watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      opacity: 0.025;
      pointer-events: none;
      z-index: 0;
    }
    .konoha-watermark svg { width: 100%; height: 100%; }

    /* ===== AMBIENT CHAKRA ORBS ===== */
    .chakra-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.35;
    }
    .chakra-orb-1 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(255, 107, 0, 0.4) 0%, transparent 70%);
      top: 5%; left: 5%;
      animation: orb-float-1 20s infinite alternate ease-in-out;
    }
    .chakra-orb-2 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(0, 137, 255, 0.35) 0%, transparent 70%);
      bottom: 5%; right: 8%;
      animation: orb-float-2 25s infinite alternate ease-in-out;
    }
    .chakra-orb-3 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(255, 199, 0, 0.25) 0%, transparent 70%);
      top: 40%; right: 25%;
      animation: orb-float-3 18s infinite alternate ease-in-out;
    }
    @keyframes orb-float-1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 80px) scale(1.2); }
    }
    @keyframes orb-float-2 {
      0% { transform: translate(0, 0) scale(1.1); }
      100% { transform: translate(-80px, -40px) scale(0.9); }
    }
    @keyframes orb-float-3 {
      0% { transform: translate(0, 0) scale(0.95); }
      100% { transform: translate(50px, -50px) scale(1.25); }
    }

    /* ===== FLOATING CHAKRA PARTICLES ===== */
    .particle-field {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      opacity: 0;
      animation: particle-drift 8s infinite linear;
    }
    .particle:nth-child(1) { left: 10%; background: var(--naruto-orange); animation-delay: 0s; }
    .particle:nth-child(2) { left: 25%; background: var(--rasengan-cyan); animation-delay: 1.2s; width: 3px; height: 3px; }
    .particle:nth-child(3) { left: 40%; background: var(--sage-gold); animation-delay: 2.5s; }
    .particle:nth-child(4) { left: 55%; background: var(--rasengan-blue); animation-delay: 0.8s; width: 5px; height: 5px; }
    .particle:nth-child(5) { left: 70%; background: var(--naruto-orange); animation-delay: 3.5s; }
    .particle:nth-child(6) { left: 85%; background: var(--rasengan-cyan); animation-delay: 1.8s; width: 3px; height: 3px; }
    .particle:nth-child(7) { left: 50%; background: var(--sage-gold); animation-delay: 4.2s; }
    .particle:nth-child(8) { left: 15%; background: var(--rasengan-blue); animation-delay: 2.2s; width: 5px; height: 5px; }
    @keyframes particle-drift {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* ===== SCROLL TRIM BORDERS (top/bottom decorative) ===== */
    .scroll-edge {
      height: 12px;
      background: linear-gradient(90deg, transparent, var(--scroll-line), transparent);
      border-radius: 4px;
      opacity: 0.5;
      margin: 0 -4px;
    }

    /* ===== MAIN SCROLL CONTAINER ===== */
    main.scroll-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ===== HEADER — Konoha Emblem + Title ===== */
    .app-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .konoha-emblem {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Bangers', cursive;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--text-dim);
      text-transform: uppercase;
    }
    .konoha-emblem svg { width: 22px; height: 22px; flex-shrink: 0; }
    .konoha-emblem svg .leaf-outline { fill: none; stroke: var(--scroll-line); stroke-width: 1.5; }
    .konoha-emblem svg .leaf-spiral { fill: none; stroke: var(--scroll-line); stroke-width: 1.2; }

    .sound-toggle {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-dim);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sound-toggle:hover { border-color: var(--sage-gold); color: var(--sage-gold); }
    .sound-toggle.active { border-color: var(--sage-gold); color: var(--sage-gold); background: rgba(255, 199, 0, 0.08); }

    .app-title {
      font-family: 'Bangers', cursive;
      font-size: 2rem;
      letter-spacing: 3px;
      color: var(--text-bright);
      text-shadow: 0 0 20px rgba(255, 107, 0, 0.3);
      line-height: 1.1;
      word-break: break-word;
    }
    .app-title .highlight-orange { color: var(--naruto-orange); text-shadow: 0 0 30px rgba(255, 107, 0, 0.4); }
    .app-title .highlight-cyan { color: var(--rasengan-cyan); text-shadow: 0 0 30px rgba(0, 229, 255, 0.3); }
    .app-title .highlight-gold { color: var(--sage-gold); text-shadow: 0 0 30px rgba(255, 199, 0, 0.3); }

    .subtitle {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .subtitle .date-display {
      color: var(--text-main);
      font-weight: 600;
    }

    /* ===== RASENGAN MASTERY TRACKER (Progress) ===== */
    .mastery-tracker {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(196, 168, 130, 0.08);
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .mastery-tracker::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(0, 137, 255, 0.05) 0%, transparent 60%);
      pointer-events: none;
    }
    .mastery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }
    .mastery-level-display {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mastery-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      position: relative;
    }
    .mastery-icon.level-1 { background: rgba(0, 137, 255, 0.2); box-shadow: 0 0 15px rgba(0, 137, 255, 0.2); }
    .mastery-icon.level-2 { background: rgba(0, 137, 255, 0.25); box-shadow: 0 0 20px rgba(0, 137, 255, 0.3); }
    .mastery-icon.level-3 { 
      background: rgba(0, 229, 255, 0.2); 
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
      animation: rasengan-throb 2s infinite ease-in-out;
    }
    .mastery-icon.level-4 {
      background: linear-gradient(135deg, rgba(255, 199, 0, 0.2), rgba(0, 229, 255, 0.2));
      box-shadow: 0 0 35px rgba(255, 199, 0, 0.3), 0 0 35px rgba(0, 229, 255, 0.2);
      animation: rasengan-throb 1.5s infinite ease-in-out;
    }
    @keyframes rasengan-throb {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 229, 255, 0.3); }
      50% { transform: scale(1.1); box-shadow: 0 0 40px rgba(0, 229, 255, 0.5); }
    }
    .mastery-icon .spin-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid transparent;
      animation: ring-spin 3s infinite linear;
    }
    .mastery-icon.level-3 .spin-ring {
      border-top-color: var(--rasengan-cyan);
      border-right-color: transparent;
    }
    .mastery-icon.level-4 .spin-ring {
      border-top-color: var(--sage-gold);
      border-bottom-color: var(--rasengan-cyan);
    }
    @keyframes ring-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .mastery-name {
      font-family: 'Russo One', sans-serif;
      font-size: 0.85rem;
      color: var(--text-bright);
      line-height: 1.2;
    }
    .mastery-sub {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-weight: 500;
    }
    .mastery-count {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--rasengan-cyan);
      background: rgba(0, 137, 255, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 0.3px;
      border: 1px solid rgba(0, 137, 255, 0.15);
      white-space: nowrap;
    }
    .mastery-bar-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    .mastery-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(90deg, var(--rasengan-blue), var(--rasengan-cyan), var(--sage-gold));
      position: relative;
    }
    .mastery-bar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      animation: bar-shimmer 2s infinite linear;
      background-size: 200% 100%;
    }
    @keyframes bar-shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* ===== CHAKRA FOCUS INPUT (Scroll-style) ===== */
    .chakra-input-section { position: relative; }
    .chakra-label {
      font-family: 'Russo One', sans-serif;
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chakra-label .hand-sign {
      display: inline-block;
      animation: hand-sign-pulse 2s infinite ease-in-out;
    }
    @keyframes hand-sign-pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .input-scroll-wrapper {
      display: flex;
      gap: 10px;
      align-items: stretch;
    }
    .scroll-input {
      flex: 1;
      background: rgba(247, 231, 206, 0.05);
      border: 1px solid rgba(196, 168, 130, 0.2);
      border-radius: 14px;
      padding: 14px 18px;
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .scroll-input::placeholder {
      color: rgba(255, 255, 255, 0.2);
      font-weight: 400;
      font-style: italic;
    }
    .scroll-input:focus {
      background: rgba(247, 231, 206, 0.08);
      border-color: rgba(0, 137, 255, 0.4);
      box-shadow: 0 0 20px rgba(0, 137, 255, 0.1), inset 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    /* ===== RASENGAN JUTSU BUTTON ===== */
    .rasengan-btn {
      background: linear-gradient(135deg, rgba(0, 137, 255, 0.3), rgba(0, 229, 255, 0.15));
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--rasengan-cyan);
      padding: 0 22px;
      border-radius: 14px;
      cursor: pointer;
      font-family: 'Russo One', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      white-space: nowrap;
    }
    .rasengan-btn .btn-icon {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(0, 229, 255, 0.8), rgba(0, 137, 255, 0.4), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }
    .rasengan-btn .btn-icon::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--rasengan-cyan);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .rasengan-btn .btn-icon svg { width: 14px; height: 14px; color: white; position: relative; z-index: 1; }
    .rasengan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px var(--rasengan-glow), 0 6px 20px rgba(0, 0, 0, 0.3);
      border-color: var(--rasengan-cyan);
    }
    .rasengan-btn:hover .btn-icon {
      animation: rasengan-spin 0.8s infinite linear;
    }
    .rasengan-btn:hover .btn-icon::before {
      opacity: 1;
      animation: ring-spin 0.6s infinite linear;
    }
    .rasengan-btn:active {
      transform: translateY(1px) scale(0.96);
    }
    .rasengan-btn.submitting {
      animation: rasengan-burst 0.5s ease forwards;
    }
    .rasengan-btn.submitting .btn-icon {
      animation: rasengan-spin 0.3s infinite linear;
    }
    @keyframes rasengan-spin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes rasengan-burst {
      0% { box-shadow: 0 0 0 rgba(0, 229, 255, 0); }
      30% { box-shadow: 0 0 50px rgba(0, 229, 255, 0.6), 0 0 100px rgba(0, 137, 255, 0.3); transform: scale(1.05); }
      100% { box-shadow: 0 0 0 rgba(0, 229, 255, 0); transform: scale(1); }
    }

    /* ===== FILTER CONTROLS — Ninja Headbands ===== */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(196, 168, 130, 0.08);
      padding-bottom: 14px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .headband-filters {
      display: flex;
      gap: 4px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 30px;
      padding: 3px;
    }
    .headband-filter {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 7px 16px;
      border-radius: 24px;
      cursor: pointer;
      font-family: 'Russo One', sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .headband-filter .filter-icon { font-size: 0.9rem; }
    .headband-filter:hover { color: var(--text-main); }
    .headband-filter.active {
      background: linear-gradient(135deg, rgba(255, 107, 0, 0.2), rgba(255, 199, 0, 0.1));
      color: var(--sage-gold);
      box-shadow: 0 0 15px rgba(255, 199, 0, 0.1), inset 0 0 0 1px rgba(255, 199, 0, 0.15);
    }
    .headband-filter.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background: var(--sage-gold);
      border-radius: 2px;
      opacity: 0.6;
    }
    .clear-missions-btn {
      background: transparent;
      border: 1px solid rgba(211, 47, 47, 0.2);
      color: rgba(211, 47, 47, 0.7);
      padding: 7px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'Russo One', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .clear-missions-btn:hover {
      background: rgba(211, 47, 47, 0.1);
      color: var(--akatsuki-red);
      border-color: var(--akatsuki-red);
    }

    /* ===== MISSION LIST ===== */
    .list-wrapper {
      position: relative;
      min-height: 140px;
    }
    .mission-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .mission-list::-webkit-scrollbar { width: 5px; }
    .mission-list::-webkit-scrollbar-track { background: transparent; }
    .mission-list::-webkit-scrollbar-thumb {
      background: rgba(196, 168, 130, 0.12);
      border-radius: 10px;
    }
    .mission-list::-webkit-scrollbar-thumb:hover { background: rgba(196, 168, 130, 0.25); }

    /* ===== SHINOBI MISSION SCROLL CARD ===== */
    .mission-scroll {
      display: flex;
      align-items: center;
      background: rgba(247, 231, 206, 0.03);
      border: 1px solid rgba(196, 168, 130, 0.08);
      padding: 14px 16px;
      border-radius: 14px;
      gap: 12px;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      animation: scroll-unfurl 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      position: relative;
      overflow: hidden;
    }
    .mission-scroll::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196, 168, 130, 0.2), transparent);
    }
    @keyframes scroll-unfurl {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
        max-height: 0;
        padding-top: 0; padding-bottom: 0;
        margin-bottom: -10px;
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        max-height: 200px;
      }
    }

    .mission-scroll:hover {
      background: rgba(247, 231, 206, 0.06);
      border-color: rgba(196, 168, 130, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    /* Rank Badge */
    .rank-badge {
      font-family: 'Russo One', sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.5px;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .rank-badge.rank-d { background: rgba(0, 137, 255, 0.1); color: var(--rasengan-blue); border-color: rgba(0, 137, 255, 0.15); }
    .rank-badge.rank-c { background: rgba(0, 229, 255, 0.1); color: var(--rasengan-cyan); border-color: rgba(0, 229, 255, 0.15); }
    .rank-badge.rank-b { background: rgba(255, 199, 0, 0.1); color: var(--sage-gold); border-color: rgba(255, 199, 0, 0.15); }
    .rank-badge.rank-a { background: rgba(255, 107, 0, 0.1); color: var(--naruto-orange); border-color: rgba(255, 107, 0, 0.15); }
    .rank-badge.rank-s { 
      background: linear-gradient(135deg, rgba(211, 47, 47, 0.1), rgba(255, 107, 0, 0.1));
      color: #FF5252; 
      border-color: rgba(255, 82, 82, 0.2);
      animation: rank-s-glow 2s infinite ease-in-out;
    }
    @keyframes rank-s-glow {
      0%, 100% { box-shadow: 0 0 5px rgba(255, 82, 82, 0.1); }
      50% { box-shadow: 0 0 15px rgba(255, 82, 82, 0.25); }
    }

    /* Completed state */
    .mission-scroll.completed {
      opacity: 0.5;
      background: rgba(0, 0, 0, 0.15);
      border-color: rgba(196, 168, 130, 0.03);
    }
    .mission-scroll.completed .mission-text { text-decoration: line-through; color: var(--text-dim); }
    .mission-scroll.completed .rank-badge { opacity: 0.5; }

    /* ===== RASENGAN IMPACT (Completion Animation) ===== */
    .mission-scroll.rasengan-impact {
      animation: rasengan-impact 0.9s ease forwards;
    }
    .mission-scroll.rasengan-impact::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: radial-gradient(circle at var(--impact-x, 50%) var(--impact-y, 50%), rgba(0, 229, 255, 0.3), transparent 60%);
      pointer-events: none;
      animation: impact-flash 0.9s ease forwards;
    }
    @keyframes rasengan-impact {
      0% { transform: scale(1); border-color: rgba(0, 229, 255, 0.3); box-shadow: 0 0 0 rgba(0, 229, 255, 0); }
      15% { transform: scale(1.03); box-shadow: 0 0 40px rgba(0, 229, 255, 0.4); }
      30% { transform: scale(0.98); box-shadow: 0 0 60px rgba(0, 229, 255, 0.3); border-color: rgba(0, 229, 255, 0.6); }
      50% { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 137, 255, 0.2); }
      70% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 137, 255, 0.1); border-color: rgba(0, 137, 255, 0.2); }
      100% { transform: scale(1); box-shadow: none; border-color: rgba(196, 168, 130, 0.08); }
    }
    @keyframes impact-flash {
      0% { opacity: 1; }
      40% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Wind cut streaks */
    .mission-scroll.rasengan-impact .wind-cut {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      width: 60px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--rasengan-cyan), transparent);
      border-radius: 2px;
    }
    .mission-scroll.rasengan-impact .wind-cut:nth-child(1) {
      top: 20%; left: -20px;
      animation: wind-slice 0.7s ease 0.1s forwards;
    }
    .mission-scroll.rasengan-impact .wind-cut:nth-child(2) {
      top: 60%; right: -20px;
      animation: wind-slice 0.7s ease 0.2s forwards reverse;
    }
    .mission-scroll.rasengan-impact .wind-cut:nth-child(3) {
      top: 80%; left: 30%;
      animation: wind-slice 0.6s ease 0.15s forwards;
    }
    @keyframes wind-slice {
      0% { transform: translateX(0) scaleX(0); opacity: 0; }
      20% { opacity: 0.8; }
      50% { transform: translateX(40px) scaleX(1); opacity: 0.6; }
      100% { transform: translateX(80px) scaleX(0.5); opacity: 0; }
    }

    /* ===== SMOKE POOF (Deletion Animation) ===== */
    .mission-scroll.smoke-poof {
      animation: smoke-poof 0.6s ease forwards;
      pointer-events: none;
    }
    .mission-scroll.smoke-poof .smoke-cloud {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 190, 180, 0.5), rgba(200, 190, 180, 0.1), transparent);
      pointer-events: none;
      opacity: 0;
    }
    .mission-scroll.smoke-poof .smoke-cloud:nth-child(4) {
      width: 80px; height: 80px;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: cloud-puff 0.6s ease forwards;
    }
    .mission-scroll.smoke-poof .smoke-cloud:nth-child(5) {
      width: 50px; height: 50px;
      top: 30%; left: 20%;
      animation: cloud-puff 0.6s ease 0.1s forwards;
    }
    .mission-scroll.smoke-poof .smoke-cloud:nth-child(6) {
      width: 60px; height: 60px;
      top: 60%; right: 15%;
      animation: cloud-puff 0.6s ease 0.05s forwards;
    }
    @keyframes smoke-poof {
      0% { opacity: 1; transform: scale(1); filter: blur(0); }
      40% { opacity: 0.9; transform: scale(1.15); filter: blur(1px); }
      70% { opacity: 0.5; transform: scale(1.35); filter: blur(3px); }
      100% { opacity: 0; transform: scale(1.6); filter: blur(6px); }
    }
    @keyframes cloud-puff {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      30% { opacity: 0.6; }
      70% { opacity: 0.3; transform: translate(-50%, -50%) scale(1.5); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
    }

    /* ===== CHECKBOX — Shuriken Style ===== */
    .shuriken-check {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }
    .shuriken-check input {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
      pointer-events: none;
    }
    .shuriken-visual {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .shuriken-visual svg {
      width: 14px; height: 14px;
      color: transparent;
      transition: all 0.3s ease;
    }
    .shuriken-check:hover .shuriken-visual {
      border-color: var(--rasengan-cyan);
      box-shadow: 0 0 12px var(--rasengan-glow);
    }
    .shuriken-check input:checked ~ .shuriken-visual {
      background: linear-gradient(135deg, var(--rasengan-blue), var(--rasengan-cyan));
      border-color: transparent;
      box-shadow: 0 0 18px var(--rasengan-glow);
    }
    .shuriken-check input:checked ~ .shuriken-visual svg {
      color: white;
    }
    .shuriken-check input:checked ~ .shuriken-visual .shuriken-spin {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: var(--rasengan-cyan);
      animation: ring-spin 1s infinite linear;
    }

    /* ===== MISSION TEXT ===== */
    .mission-text-box {
      flex: 1;
      overflow: hidden;
      min-width: 0;
    }
    .mission-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      transition: color 0.25s ease;
      cursor: text;
    }
    .inline-edit-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 6px 10px;
      outline: none;
      box-sizing: border-box;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
    }

    /* ===== ACTION BUTTONS ===== */
    .mission-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.2s ease;
      flex-shrink: 0;
    }
    .mission-scroll:hover .mission-actions,
    .mission-scroll:focus-within .mission-actions { opacity: 1; }
    @media (max-width: 600px) { .mission-actions { opacity: 0.7; } }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.04); }
    .action-btn.edit-btn:hover { color: var(--rasengan-cyan); }
    .action-btn.delete-btn:hover { color: var(--akatsuki-red); background: rgba(211, 47, 47, 0.06); }

    /* ===== EMPTY STATE ===== */
    .empty-scroll {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      text-align: center;
      animation: scroll-unfurl 0.5s ease forwards;
    }
    .empty-icon {
      width: 70px; height: 70px;
      margin-bottom: 16px;
      opacity: 0.4;
      position: relative;
    }
    .empty-icon .rasengan-mini {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, rgba(0, 229, 255, 0.15), rgba(0, 137, 255, 0.08), transparent);
      animation: rasengan-throb 3s infinite ease-in-out;
    }
    .empty-icon .rasengan-mini::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: rgba(0, 229, 255, 0.2);
      animation: ring-spin 3s infinite linear;
    }
    .empty-title {
      font-family: 'Russo One', sans-serif;
      font-size: 1.1rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .empty-title .emphasize { color: var(--rasengan-cyan); }
    .empty-sub {
      font-size: 0.85rem;
      color: var(--text-dim);
      max-width: 260px;
      line-height: 1.4;
      opacity: 0.7;
    }

    /* ===== ANIMATION HELPER CLASSES ===== */
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

    /* ===== HEADBAND DECORATIVE DIVIDER ===== */
    .headband-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0.3;
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 2px;
    }
    .headband-divider::before,
    .headband-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--scroll-line), transparent);
    }

    /* ===== RASENGAN LOADING SCREEN ===== */
    .rasengan-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    .rasengan-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loading-rasengan {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: load-float 2s infinite ease-in-out;
    }
    @keyframes load-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .loading-rasengan-core {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, var(--rasengan-cyan) 40%, var(--rasengan-blue) 70%, transparent);
      box-shadow: 0 0 30px var(--rasengan-glow), 0 0 60px rgba(0, 137, 255, 0.3), 0 0 100px rgba(0, 137, 255, 0.15);
      animation: core-pulse 1.5s infinite ease-in-out;
      z-index: 3;
    }
    @keyframes core-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--rasengan-glow); }
      50% { transform: scale(1.15); box-shadow: 0 0 50px var(--rasengan-glow), 0 0 80px rgba(0, 137, 255, 0.2); }
    }
    .loading-rasengan-ring-1,
    .loading-rasengan-ring-2,
    .loading-rasengan-ring-3 {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
      z-index: 2;
    }
    .loading-rasengan-ring-1 {
      width: 70px; height: 70px;
      border-top-color: var(--rasengan-cyan);
      border-right-color: transparent;
      animation: ring-spin 1.2s infinite linear;
      opacity: 0.8;
    }
    .loading-rasengan-ring-2 {
      width: 90px; height: 90px;
      border-bottom-color: var(--rasengan-blue);
      border-left-color: transparent;
      animation: ring-spin 1.8s infinite linear reverse;
      opacity: 0.6;
    }
    .loading-rasengan-ring-3 {
      width: 110px; height: 110px;
      border-top-color: rgba(255, 255, 255, 0.2);
      border-bottom-color: var(--rasengan-cyan);
      animation: ring-spin 2.5s infinite linear;
      opacity: 0.3;
    }
    @keyframes ring-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-rasengan-particle {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--rasengan-cyan);
      z-index: 1;
      animation: load-particle 1.5s infinite ease-out;
    }
    .loading-rasengan-particle.p1 { top: -8px; left: 50%; transform: translateX(-50%); animation-delay: 0s; }
    .loading-rasengan-particle.p2 { top: 50%; right: -8px; transform: translateY(-50%); animation-delay: 0.2s; }
    .loading-rasengan-particle.p3 { bottom: -8px; left: 50%; transform: translateX(-50%); animation-delay: 0.4s; }
    .loading-rasengan-particle.p4 { top: 50%; left: -8px; transform: translateY(-50%); animation-delay: 0.6s; }
    .loading-rasengan-particle.p5 { top: 10%; right: -4px; animation-delay: 0.1s; }
    .loading-rasengan-particle.p6 { bottom: 10%; left: -4px; animation-delay: 0.3s; }
    .loading-rasengan-particle.p7 { top: 30%; left: -6px; animation-delay: 0.5s; }
    .loading-rasengan-particle.p8 { bottom: 30%; right: -6px; animation-delay: 0.7s; }
    @keyframes load-particle {
      0% { transform: scale(0); opacity: 0; }
      20% { transform: scale(1.5); opacity: 1; }
      80% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(0.3) translate(15px, -15px); opacity: 0; }
    }
    .loading-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .loading-title {
      font-family: 'Bangers', cursive;
      font-size: 1.6rem;
      letter-spacing: 6px;
      background: linear-gradient(135deg, var(--rasengan-cyan), var(--rasengan-blue), var(--rasengan-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: load-title-pulse 2s infinite ease-in-out;
    }
    @keyframes load-title-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.4); }
    }
    .loading-sub {
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: load-sub-pulse 2s infinite ease-in-out 0.3s;
    }
    @keyframes load-sub-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 520px) {
      body { padding: 12px 8px; }
      main.scroll-container { padding: 22px 16px; gap: 18px; border-radius: 16px; }
      .app-title { font-size: 1.5rem; letter-spacing: 2px; }
      .input-scroll-wrapper { flex-direction: column; }
      .rasengan-btn { justify-content: center; padding: 12px 16px; width: 100%; }
      .controls-row { flex-direction: column; align-items: stretch; }
      .headband-filters { justify-content: center; }
      .clear-missions-btn { width: 100%; text-align: center; }
      .mission-scroll { padding: 12px 12px; gap: 10px; }
      .rank-badge { font-size: 0.5rem; padding: 2px 8px; }
      .mastery-header { flex-direction: column; align-items: flex-start; gap: 6px; }
      .mastery-count { align-self: flex-start; }
    }

    @media (max-width: 380px) {
      .app-title { font-size: 1.2rem; }
      .header-top { flex-direction: column; gap: 8px; align-items: flex-start; }
      .mission-scroll { flex-wrap: wrap; }
      .mission-actions { width: 100%; justify-content: flex-end; }
    }

    /* ===== FOCUS RINGS ===== */
    button:focus-visible,
    input:focus-visible,
    .shuriken-check:focus-within .shuriken-visual {
      outline: 2px solid var(--rasengan-cyan);
      outline-offset: 3px;
    }

    /* ===== SMOOTH TRANSITIONS FOR ALL ===== */
    .mission-scroll, .rank-badge, .mastery-bar-fill {
      will-change: transform, opacity;
    }
  </style>
</head>
<body>

  <!-- ===== RASENGAN LOADING SCREEN ===== -->
  <div class="rasengan-loading" id="rasengan-loading">
    <div class="loading-rasengan">
      <div class="loading-rasengan-core"></div>
      <div class="loading-rasengan-ring-1"></div>
      <div class="loading-rasengan-ring-2"></div>
      <div class="loading-rasengan-ring-3"></div>
      <div class="loading-rasengan-particle p1"></div>
      <div class="loading-rasengan-particle p2"></div>
      <div class="loading-rasengan-particle p3"></div>
      <div class="loading-rasengan-particle p4"></div>
      <div class="loading-rasengan-particle p5"></div>
      <div class="loading-rasengan-particle p6"></div>
      <div class="loading-rasengan-particle p7"></div>
      <div class="loading-rasengan-particle p8"></div>
    </div>
    <div class="loading-text">
      <span class="loading-title">Rasengan</span>
      <span class="loading-sub">Focusing Chakra...</span>
    </div>
  </div>

  <!-- ===== KONOHA WATERMARK ===== -->
  <div class="konoha-watermark" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 10 L120 70 L190 70 L135 105 L155 170 L100 135 L45 170 L65 105 L10 70 L80 70 Z" 
            stroke="currentColor" stroke-width="0.5" fill="none" opacity="0.5"/>
      <circle cx="100" cy="100" r="40" stroke="currentColor" stroke-width="0.3" fill="none" opacity="0.3"/>
      <circle cx="100" cy="100" r="15" stroke="currentColor" stroke-width="0.3" fill="none" opacity="0.3"/>
    </svg>
  </div>

  <!-- ===== AMBIENT CHAKRA ORBS ===== -->
  <div class="chakra-orb chakra-orb-1" aria-hidden="true"></div>
  <div class="chakra-orb chakra-orb-2" aria-hidden="true"></div>
  <div class="chakra-orb chakra-orb-3" aria-hidden="true"></div>

  <!-- ===== CHAKRA PARTICLES ===== -->
  <div class="particle-field" aria-hidden="true">
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>

  <!-- ===== MAIN SHINOBI SCROLL CONTAINER ===== -->
  <main class="scroll-container">

    <!-- ===== HEADER ===== -->
    <header class="app-header">
      <div class="header-top">
        <span class="konoha-emblem" aria-label="Hidden Leaf Village">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 2 L14 9 L21 9 L15.5 13.5 L18 21 L12 16.5 L6 21 L8.5 13.5 L3 9 L10 9 Z" 
                  class="leaf-outline"/>
            <path d="M12 6 Q14 12 12 16 Q10 12 12 6" class="leaf-spiral"/>
          </svg>
          <span>Hidden Leaf</span>
        </span>
        <button class="sound-toggle" id="sound-toggle" aria-label="Toggle sound effects" title="Toggle Sound FX">
          <span>🔇</span>
          <span class="sound-label">SFX</span>
        </button>
      </div>
      <h1 class="app-title">
        <span class="highlight-orange">S</span><span class="highlight-cyan">h</span><span class="highlight-gold">i</span><span class="highlight-orange">n</span><span class="highlight-cyan">o</span><span class="highlight-gold">b</span><span class="highlight-orange">i</span>
        <span style="color:var(--text-bright)">Scroll</span>
      </h1>
      <p class="subtitle">
        <span class="hand-sign" aria-hidden="true">🤞</span>
        Mission Board · <span class="date-display" id="current-date">Loading...</span>
      </p>
    </header>

    <!-- ===== RASENGAN MASTERY TRACKER ===== -->
    <section class="mastery-tracker" aria-label="Rasengan Mastery Progress">
      <div class="mastery-header">
        <div class="mastery-level-display">
          <div class="mastery-icon level-1" id="mastery-icon">
            <span id="mastery-emoji">🌀</span>
            <span class="spin-ring"></span>
          </div>
          <div>
            <div class="mastery-name" id="mastery-name">Basic Rasengan</div>
            <div class="mastery-sub" id="mastery-sub">Chakra Mastery Initiate</div>
          </div>
        </div>
        <span class="mastery-count" id="mastery-count" aria-live="polite">0 / 0</span>
      </div>
      <div class="mastery-bar-track">
        <div class="mastery-bar-fill" id="mastery-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
      </div>
    </section>

    <!-- ===== CHAKRA FOCUS INPUT ===== -->
    <section class="chakra-input-section">
      <div class="chakra-label">
        <span class="hand-sign" aria-hidden="true">👐</span>
        Focus Your Chakra &amp; Cast Jutsu
      </div>
      <form id="todo-form">
        <div class="input-scroll-wrapper">
          <input
            type="text"
            id="todo-input"
            class="scroll-input"
            placeholder="Enter your mission objective..."
            autocomplete="off"
            required
            aria-label="New mission name"
          >
          <button type="submit" class="rasengan-btn" id="add-btn" aria-label="Execute Jutsu">
            <span class="btn-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </span>
            <span>Add mission</span>
          </button>
        </div>
      </form>
    </section>

    <!-- ===== NINJA HEADBAND FILTERS ===== -->
    <section class="controls-row">
      <div class="headband-filters" role="tablist" aria-label="Filter missions">
        <button class="headband-filter active" data-filter="all" role="tab" aria-selected="true">
          <span class="filter-icon">👤</span> All
        </button>
        <button class="headband-filter" data-filter="active" role="tab" aria-selected="false">
          <span class="filter-icon">⚔️</span> Active
        </button>
        <button class="headband-filter" data-filter="completed" role="tab" aria-selected="false">
          <span class="filter-icon">✅</span> Done
        </button>
      </div>
      <button class="clear-missions-btn" id="clear-completed" style="display:none;" aria-label="Clear completed missions">
        ✖ Clear
      </button>
    </section>

    <!-- ===== MISSION LIST ===== -->
    <section class="list-wrapper">
      <ul class="mission-list" id="mission-list" aria-label="Mission scroll list">
        <!-- Dynamically injected -->
      </ul>

      <!-- Empty State -->
      <div class="empty-scroll" id="empty-state" style="display:none;">
        <div class="empty-icon" aria-hidden="true">
          <div class="rasengan-mini"></div>
        </div>
        <h3 class="empty-title">No <span class="emphasize">Missions</span> Today</h3>
        <p class="empty-sub">A shinobi's work is never done.<br/>Focus your chakra and add a new mission above.</p>
      </div>
    </section>

    <!-- ===== FOOTER DIVIDER (Scroll end) ===== -->
    <div class="headband-divider" aria-hidden="true">
      <span>✦</span> Hidden Leaf · Konoha <span>✦</span>
    </div>

  </main>

  <!-- ===== JAVASCRIPT — SHINOBI MISSION MANAGER ===== -->
  <script>
    class ShinobiMissionApp {
      constructor() {
        this.missions = this.loadMissions();
        this.filter = 'all';
        this.soundEnabled = false;

        // DOM refs
        this.form = document.getElementById('todo-form');
        this.input = document.getElementById('todo-input');
        this.list = document.getElementById('mission-list');
        this.empty = document.getElementById('empty-state');
        this.dateEl = document.getElementById('current-date');
        this.countEl = document.getElementById('mastery-count');
        this.bar = document.getElementById('mastery-bar');
        this.icon = document.getElementById('mastery-icon');
        this.nameEl = document.getElementById('mastery-name');
        this.subEl = document.getElementById('mastery-sub');
        this.emojiEl = document.getElementById('mastery-emoji');
        this.filterTabs = document.querySelectorAll('.headband-filter');
        this.clearBtn = document.getElementById('clear-completed');
        this.soundToggle = document.getElementById('sound-toggle');
        this.addBtn = document.getElementById('add-btn');

        this.init();
      }

      // ----- RANKS & MASTERY LEVELS -----
      static RANKS = ['D', 'C', 'B', 'A', 'S'];
      static RANK_EMOJI = { D: '🥉', C: '🥈', B: '🥇', A: '💎', S: '👑' };

      static MASTERY_LEVELS = [
        { min: 0,  max: 25,  name: 'Basic Rasengan',       sub: 'Chakra Mastery Initiate',     emoji: '🌀', cls: 'level-1' },
        { min: 26, max: 50,  name: 'Ōdama Rasengan',       sub: 'Big Ball Rasengan Adept',     emoji: '🌀', cls: 'level-2' },
        { min: 51, max: 75,  name: 'Rasenshuriken',         sub: 'Wind Blade Jutsu Expert',     emoji: '🌪️', cls: 'level-3' },
        { min: 76, max: 100, name: 'Ultra-Big Ball Rasen',  sub: 'Sage Art · Tailed Beast Mode', emoji: '⚡', cls: 'level-4' },
      ];

      getRandomRank() {
        const weighted = ['D','D','D','C','C','C','B','B','A','S'];
        return weighted[Math.floor(Math.random() * weighted.length)];
      }

      getMasteryLevel(percent) {
        const p = Math.min(100, Math.max(0, percent));
        for (const lvl of ShinobiMissionApp.MASTERY_LEVELS) {
          if (p >= lvl.min && p <= lvl.max) return lvl;
        }
        return ShinobiMissionApp.MASTERY_LEVELS[0];
      }

      // ----- SOUND FX (Web Audio API) -----
      initAudio() {
        if (this.audioCtx) return;
        try {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch { this.soundEnabled = false; }
      }

      playHandSign() {
        if (!this.soundEnabled || !this.audioCtx) return;
        const ctx = this.audioCtx;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain).connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.08);
      }

      playRasengan() {
        if (!this.soundEnabled || !this.audioCtx) return;
        const ctx = this.audioCtx;
        // Swirling noise
        const bufferSize = ctx.sampleRate * 0.4;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.sin(2 * Math.PI * i * (40 + i * 80 / bufferSize) / ctx.sampleRate);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(300, ctx.currentTime);
        filter.Q.setValueAtTime(2, ctx.currentTime);
        noise.connect(filter).connect(gain).connect(ctx.destination);
        noise.start(); noise.stop(ctx.currentTime + 0.4);
      }

      playSmoke() {
        if (!this.soundEnabled || !this.audioCtx) return;
        const ctx = this.audioCtx;
        const bufferSize = ctx.sampleRate * 0.35;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        noise.connect(gain).connect(ctx.destination);
        noise.start(); noise.stop(ctx.currentTime + 0.35);
      }

      playComplete() {
        if (!this.soundEnabled || !this.audioCtx) return;
        const ctx = this.audioCtx;
        // Rising chime
        [523, 659, 784].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.08);
          gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.2);
          osc.connect(gain).connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.08);
          osc.stop(ctx.currentTime + i * 0.08 + 0.2);
        });
      }

      // ----- STORAGE -----
      loadMissions() {
        try {
          const stored = localStorage.getItem('naruto_shinobi_missions');
          if (stored) return JSON.parse(stored);
          return [
            { id: '1', text: 'Train to become Hokage', completed: false, createdAt: Date.now(), rank: 'S' },
            { id: '2', text: 'Master the Rasengan technique', completed: false, createdAt: Date.now() + 1, rank: 'A' },
            { id: '3', text: 'Complete daily D-rank missions', completed: true, createdAt: Date.now() + 2, rank: 'D' },
          ];
        } catch { return []; }
      }

      saveMissions() {
        try {
          localStorage.setItem('naruto_shinobi_missions', JSON.stringify(this.missions));
        } catch { /* silent */ }
      }

      // ----- INIT -----
      init() {
        this.renderDate();
        this.bindEvents();
        this.render();
        this.dismissLoading();
      }

      dismissLoading() {
        const loader = document.getElementById('rasengan-loading');
        if (!loader) return;
        setTimeout(() => {
          loader.classList.add('hidden');
          setTimeout(() => { loader.remove(); }, 600);
        }, 2000);
      }

      renderDate() {
        const opts = { weekday: 'long', month: 'short', day: 'numeric' };
        this.dateEl.textContent = new Date().toLocaleDateString('en-US', opts);
      }

      // ----- EVENTS -----
      bindEvents() {
        this.form.addEventListener('submit', (e) => {
          e.preventDefault();
          const text = this.input.value.trim();
          if (!text) return;
          this.addMission(text);
          this.input.value = '';
        });

        this.list.addEventListener('click', (e) => {
          const el = e.target.closest('.mission-scroll');
          if (!el) return;
          const id = el.dataset.id;

          if (e.target.closest('.shuriken-check')) {
            e.preventDefault();
            this.toggleMission(id, el);
          } else if (e.target.closest('.delete-btn')) {
            this.deleteMission(el, id);
          } else if (e.target.closest('.edit-btn')) {
            this.activateEdit(el);
          }
        });

        this.list.addEventListener('dblclick', (e) => {
          const span = e.target.closest('.mission-text');
          if (!span) return;
          const el = span.closest('.mission-scroll');
          if (el && !el.classList.contains('completed')) {
            this.activateEdit(el);
          }
        });

        this.filterTabs.forEach(tab => {
          tab.addEventListener('click', () => {
            this.filterTabs.forEach(t => {
              t.classList.remove('active');
              t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            this.filter = tab.dataset.filter;
            this.render();
          });
        });

        this.clearBtn.addEventListener('click', () => this.removeCompleted());

        this.soundToggle.addEventListener('click', () => {
          this.soundEnabled = !this.soundEnabled;
          if (this.soundEnabled) this.initAudio();
          this.soundToggle.classList.toggle('active');
          this.soundToggle.querySelector('span:first-child').textContent = this.soundEnabled ? '🔊' : '🔇';
          if (this.soundEnabled) this.playHandSign();
        });
      }

      // ----- CRUD -----
      addMission(text) {
        const mission = {
          id: Date.now().toString(),
          text,
          completed: false,
          createdAt: Date.now(),
          rank: this.getRandomRank()
        };
        this.missions.unshift(mission);
        this.saveMissions();
        this.playRasengan();
        // Button burst animation
        this.addBtn.classList.add('submitting');
        setTimeout(() => this.addBtn.classList.remove('submitting'), 500);
        this.render();
      }

      toggleMission(id, el) {
        const wasCompleted = this.missions.find(m => m.id === id)?.completed;

        this.missions = this.missions.map(m => {
          if (m.id === id) return { ...m, completed: !m.completed };
          return m;
        });
        this.saveMissions();

        if (!wasCompleted) {
          // Immediately reflect completed state visually
          el.classList.add('completed');
          const cbx = el.querySelector('input[type="checkbox"]');
          if (cbx) cbx.checked = true;

          // Rasengan Impact animation
          this.playComplete();
          el.style.setProperty('--impact-x', '50%');
          el.style.setProperty('--impact-y', '50%');
          el.classList.add('rasengan-impact');
          el.querySelectorAll('.wind-cut').forEach(w => w.remove());
          for (let i = 0; i < 3; i++) {
            const w = document.createElement('div');
            w.className = 'wind-cut';
            el.appendChild(w);
          }
          setTimeout(() => {
            el.classList.remove('rasengan-impact');
            el.querySelectorAll('.wind-cut').forEach(w => w.remove());
            this.render();
          }, 950);
        } else {
          this.render();
        }
      }

      deleteMission(el, id) {
        this.playSmoke();
        el.classList.add('smoke-poof');
        el.querySelectorAll('.smoke-cloud').forEach(s => s.remove());
        for (let i = 0; i < 3; i++) {
          const s = document.createElement('div');
          s.className = 'smoke-cloud';
          el.appendChild(s);
        }
        el.addEventListener('animationend', (ev) => {
          if (ev.animationName === 'smoke-poof') {
            this.missions = this.missions.filter(m => m.id !== id);
            this.saveMissions();
            this.render();
          }
        }, { once: true });
      }

      removeCompleted() {
        const completedEls = this.list.querySelectorAll('.mission-scroll.completed');
        if (completedEls.length === 0) {
          this.missions = this.missions.filter(m => !m.completed);
          this.saveMissions();
          this.render();
          return;
        }
        let count = 0;
        completedEls.forEach(el => {
          this.playSmoke();
          el.classList.add('smoke-poof');
          el.querySelectorAll('.smoke-cloud').forEach(s => s.remove());
          for (let i = 0; i < 3; i++) {
            const s = document.createElement('div');
            s.className = 'smoke-cloud';
            el.appendChild(s);
          }
          el.addEventListener('animationend', (ev) => {
            if (ev.animationName === 'smoke-poof') {
              count++;
              if (count === completedEls.length) {
                this.missions = this.missions.filter(m => !m.completed);
                this.saveMissions();
                this.render();
              }
            }
          }, { once: true });
        });
      }

      activateEdit(el) {
        const span = el.querySelector('.mission-text');
        const input = el.querySelector('.inline-edit-input');
        const actions = el.querySelector('.mission-actions');
        const check = el.querySelector('.shuriken-check');

        if (!span || !input) return;
        span.style.display = 'none';
        input.style.display = 'block';
        input.value = span.textContent.trim();
        input.focus();
        input.select();
        if (actions) actions.style.opacity = '0';
        if (check) check.style.pointerEvents = 'none';

        const save = () => {
          const val = input.value.trim();
          const id = el.dataset.id;
          if (val && val !== span.textContent.trim()) {
            this.missions = this.missions.map(m => {
              if (m.id === id) return { ...m, text: val };
              return m;
            });
            this.saveMissions();
          }
          this.render();
        };
        const cancel = () => this.render();

        input.onkeydown = (e) => {
          if (e.key === 'Enter') { input.onblur = null; save(); }
          else if (e.key === 'Escape') { input.onblur = null; cancel(); }
        };
        input.onblur = () => save();
      }

      // ----- FILTER & SORT -----
      getFiltered() {
        let items = [...this.missions];
        if (this.filter === 'active') items = items.filter(m => !m.completed);
        else if (this.filter === 'completed') items = items.filter(m => m.completed);
        items.sort((a, b) => {
          if (a.completed !== b.completed) return a.completed ? 1 : -1;
          return b.createdAt - a.createdAt;
        });
        return items;
      }

      // ----- RENDER -----
      render() {
        const visible = this.getFiltered();
        this.list.innerHTML = '';

        if (visible.length === 0) {
          this.list.style.display = 'none';
          this.empty.style.display = 'flex';
          const title = this.empty.querySelector('.empty-title');
          const sub = this.empty.querySelector('.empty-sub');
          if (this.filter === 'completed') {
            title.innerHTML = 'No <span class="emphasize">Completed</span> Missions';
            sub.textContent = 'Complete your daily missions to see your achievements recorded here.';
          } else if (this.filter === 'active') {
            title.innerHTML = 'All <span class="emphasize">Missions</span> Cleared!';
            sub.textContent = 'Perfect score! Ready for new missions or take a well-deserved break.';
          } else {
            title.innerHTML = 'No <span class="emphasize">Missions</span> Today';
            sub.textContent = 'A shinobi\'s work is never done. Focus your chakra and add a new mission above.';
          }
        } else {
          this.list.style.display = 'flex';
          this.empty.style.display = 'none';
          const frag = document.createDocumentFragment();
          visible.forEach(m => frag.appendChild(this.createMissionElement(m)));
          this.list.appendChild(frag);
        }

        this.renderStats();
      }

      createMissionElement(mission) {
        const li = document.createElement('li');
        li.className = `mission-scroll ${mission.completed ? 'completed' : ''}`;
        li.dataset.id = mission.id;

        const safe = this.escape(mission.text);
        const rankCls = `rank-${mission.rank.toLowerCase()}`;
        const rankEmoji = ShinobiMissionApp.RANK_EMOJI[mission.rank] || '📜';

        li.innerHTML = `
          <label class="shuriken-check">
            <input type="checkbox" ${mission.completed ? 'checked' : ''} aria-label="Complete mission">
            <span class="shuriken-visual">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span class="shuriken-spin"></span>
            </span>
          </label>

          <span class="rank-badge ${rankCls}">${rankEmoji} ${mission.rank}-Rank</span>

          <div class="mission-text-box">
            <span class="mission-text" tabindex="0">${safe}</span>
            <input type="text" class="inline-edit-input" style="display:none;" aria-label="Edit mission">
          </div>

          <div class="mission-actions">
            ${!mission.completed ? `
              <button class="action-btn edit-btn" aria-label="Edit mission">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 20h9"></path>
                  <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
                </svg>
              </button>
            ` : ''}
            <button class="action-btn delete-btn" aria-label="Delete mission">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              </svg>
            </button>
          </div>
        `;
        return li;
      }

      escape(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
      }

      renderStats() {
        const total = this.missions.length;
        const done = this.missions.filter(m => m.completed).length;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;

        this.countEl.textContent = `${done} / ${total}`;
        this.bar.style.width = `${pct}%`;
        this.bar.setAttribute('aria-valuenow', pct);

        const lvl = this.getMasteryLevel(pct);
        this.nameEl.textContent = lvl.name;
        this.subEl.textContent = lvl.sub;
        this.emojiEl.textContent = lvl.emoji;
        this.icon.className = `mastery-icon ${lvl.cls}`;
        if (lvl.cls === 'level-3' || lvl.cls === 'level-4') {
          const ring = document.createElement('span');
          ring.className = 'spin-ring';
          this.icon.appendChild(ring);
        }

        // Show/hide clear button
        this.clearBtn.style.display = done > 0 ? '' : 'none';
      }
    }

    // Launch
    document.addEventListener('DOMContentLoaded', () => new ShinobiMissionApp());
  </script>
</body>
